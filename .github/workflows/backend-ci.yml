name: NOVA Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nova_db
      GROQ_API_KEY: ci-test-key
      AUTH_JWT_SECRET_KEY: ci-test-auth-jwt-secret-key-32-characters-min
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ZmFrZS1jaS1mb3JtLWtleS1yZXBsYWNlLW1lLQ==

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_DB: nova_db
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Enable pgvector extension
        working-directory: backend
        run: |
          python -c "import os, psycopg; conn=psycopg.connect(os.environ['DATABASE_URL']); conn.execute('CREATE EXTENSION IF NOT EXISTS vector'); conn.commit(); conn.close()"

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q

      - name: Check whitespace errors
        run: git diff --check
