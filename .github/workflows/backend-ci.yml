name: NOVA Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nova_db
      GROQ_API_KEY: ci-test-key
      AUTH_JWT_SECRET_KEY: ci-test-auth-jwt-secret-key-32-characters-min
      INTEGRATION_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_DB: nova_db
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nova_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Validate local Docker Compose configuration
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Enable pgvector extension
        working-directory: backend
        run: |
          python -c "import os, psycopg; url=os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); conn=psycopg.connect(url); conn.execute('CREATE EXTENSION IF NOT EXISTS vector'); conn.commit(); conn.close()"

      - name: Bootstrap legacy migration baseline
        working-directory: backend
        run: |
          python -c "import os, psycopg, pathlib; url=os.environ['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1); sql=pathlib.Path('migrations/legacy_schema.sql').read_text(encoding='utf-8'); conn=psycopg.connect(url); conn.execute(sql); conn.commit(); conn.close()"

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q

      - name: Docker Compose runtime smoke test
        run: |
          set -e
          cleanup() {
            docker compose -f docker-compose.local.yml logs --no-color --tail=200 backend migrate postgres || true
            docker compose -f docker-compose.local.yml down -v || true
          }
          trap cleanup EXIT

          docker compose -f docker-compose.local.yml up -d --build
          curl --fail --retry 90 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/health/live
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/health/ready

          backend_id="$(docker compose -f docker-compose.local.yml ps -q backend)"
          test -n "$backend_id"

          for attempt in $(seq 1 30); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")"
            if [ "$health_status" = "healthy" ]; then
              break
            fi

            if [ "$health_status" = "unhealthy" ]; then
              docker inspect --format '{{json .State.Health}}' "$backend_id"
              exit 1
            fi

            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$backend_id")" = "healthy"

      - name: Check whitespace errors
        run: git diff --check
