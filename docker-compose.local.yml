services:
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_HOST_PORT:-8080}/
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nova-local-search-secret-change-me}
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8080}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: nova_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/legacy_schema.sql:/docker-entrypoint-initdb.d/001_legacy_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d nova_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nova_db
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "alembic",
        "upgrade",
        "head"
      ]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOVA_ENV: development
      NOVA_FRONTEND_ORIGIN: ${NOVA_FRONTEND_ORIGIN:-https://sarosh548.github.io}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nova_db
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your environment or local .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_LIVE_VOICE: ${GEMINI_LIVE_VOICE:-Aoede}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080/search}
      AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY:-local-test-auth-jwt-secret-key-32-characters}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      CALENDAR_GOOGLE_CLIENT_ID: ${CALENDAR_GOOGLE_CLIENT_ID:-}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${CALENDAR_GOOGLE_CLIENT_SECRET:-}
      CALENDAR_GOOGLE_REDIRECT_URI: ${CALENDAR_GOOGLE_REDIRECT_URI:-http://localhost:8000/integrations/google/calendar/callback}
      CALENDAR_GOOGLE_SCOPES: ${CALENDAR_GOOGLE_SCOPES:-https://www.googleapis.com/auth/calendar.events}
      INTEGRATION_TOKEN_ENCRYPTION_KEY: ${INTEGRATION_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  nova-postgres-data:
